<head>

<title>NorthStar Film: Assembly</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root { --bg: var(--ns-black); --cyan: #27bdfa; --grey: #c5c5c5; --ray: #3b82f6; --teal: var(--ns-teal-500); --ink: #f4f6ff; --muted: #9a9ac4; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 50% 50%;
    background: var(--bg); font-family: "Open Sans", sans-serif; color: var(--ink); }
  .mono { font-family: "JetBrains Mono", monospace; }

  /* The docs site's light: side rays from the top right, with the big mark overlaid */
  .rays { position: absolute; inset: 0; }
  .rays canvas { position: absolute; inset: 0; }
  .rays__mark { position: absolute; top: -8%; right: -8%; width: 900px; mix-blend-mode: overlay; opacity: .9; }

  .scene { position: absolute; inset: 0; visibility: hidden; }
  .space { position: absolute; inset: 0; perspective: 1600px; }
  .rig { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .card { position: absolute; width: 1600px; height: 900px; margin: -450px 0 0 -800px; border-radius: 16px; overflow: hidden; background: #0b0b18;
    box-shadow: 0 50px 120px -30px #000d, 0 0 0 1px #ffffff1c; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .dash { position: absolute; width: 1600px; height: 900px; overflow: hidden; background: #0f0f24; }
  .dash iframe { width: 1600px; height: 900px; border: 0; display: block; pointer-events: none; }
  .card .dash { position: static; }

  .scrim { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(120% 70% at 0% 100%, #05050ff5 0%, #05050fd9 30%, #05050f66 52%, transparent 70%); }
  .line { position: absolute; left: 120px; bottom: 104px; width: 1180px; z-index: 6; opacity: 0; }
  .line .k { font: 600 17px/1 "JetBrains Mono", monospace; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); margin-bottom: 24px; display: flex; gap: 16px; align-items: center; }
  .line .k::before { content: ""; width: 44px; height: 2px; background: var(--cyan); }
  .line p { margin: 0; font-weight: 700; font-size: 62px; line-height: 1.08; letter-spacing: -.025em; }
  .line .w { display: inline-block; }

  .logo { position: absolute; left: 50%; top: 44%; width: 300px; margin: -156px 0 0 -150px; overflow: visible; }
  .logo #dia { filter: drop-shadow(0 0 22px #27bdfa); }
  .word { position: absolute; left: 0; right: 0; top: 64%; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: .08em; }
  .word b { font-weight: 300; letter-spacing: .08em; }
  .word .c { display: inline-block; }
  .tag { position: absolute; left: 0; right: 0; top: 78%; text-align: center; font: 600 20px/1 "JetBrains Mono", monospace; letter-spacing: .3em; color: var(--muted); }

  .swatch { position: absolute; width: 330px; height: 236px; margin: -118px 0 0 -165px; border-radius: 14px; background: #10101e; box-shadow: 0 0 0 1px #ffffff1c, 0 40px 80px -20px #000c; overflow: hidden; }
  .swatch i { display: block; height: 150px; }
  .swatch b { display: block; padding: 16px 20px 4px; font-size: 22px; } .swatch span { display: block; padding: 0 20px; font: 400 15px/1 "JetBrains Mono", monospace; color: var(--muted); }
  .big { position: absolute; font-weight: 800; letter-spacing: -.05em; line-height: .85; white-space: nowrap; }
  .big small { display: block; font: 600 26px/1 "JetBrains Mono", monospace; letter-spacing: .26em; text-transform: uppercase; color: var(--cyan); margin-top: 18px; }

  .ticker { position: absolute; right: 120px; top: 0; bottom: 0; width: 470px; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 25%, #000 75%, transparent); }
  .ticker div { font: 600 30px/58px "Open Sans"; color: #ffffffd0; white-space: nowrap; }
  .ticker div span { font: 400 14px/1 "JetBrains Mono", monospace; color: var(--cyan); margin-right: 18px; letter-spacing: .1em; }

  .cols { position: absolute; left: 115px; right: 24px; top: 0; bottom: 0; display: grid; grid-template-columns: repeat(12, 1fr); gap: 0 17px; }
  .cols i { border-left: 1px solid #27bdfa50; border-right: 1px solid #27bdfa50; background: #27bdfa0a; transform-origin: top; }
  .blk { position: absolute; border-radius: 26px; background: #1c1c3a; }
  .blk b { position: absolute; left: 28px; top: 26px; font: 600 15px/1.4 "JetBrains Mono", monospace; letter-spacing: .06em; color: #ffffffa0; }

  .chip { position: absolute; padding: 18px 26px; border-radius: 12px; background: #05050fe6; border: 1.5px solid #27bdfa; white-space: nowrap;
    font: 600 30px/1 "JetBrains Mono", monospace; color: var(--ink); box-shadow: 0 20px 50px -10px #000c; }
  .chip em { font-style: normal; color: var(--cyan); }
  .chip--big { font: 700 44px/1 "Open Sans"; letter-spacing: -.01em; }
  .chip--big em { font-weight: 800; }

  .key { position: absolute; display: flex; gap: 18px; }
  .key span { width: 150px; height: 150px; border-radius: 26px; background: linear-gradient(#22223a, #12121f); box-shadow: 0 0 0 1.5px #ffffff26, 0 14px 0 #08080f, 0 40px 60px -10px #000; display: grid; place-items: center; font: 700 64px/1 "Open Sans"; }

  .split { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--cyan); box-shadow: 0 0 40px var(--cyan); z-index: 3; }

  .endmark { position: absolute; left: 50%; top: 47%; width: 1160px; margin: -63px 0 0 -580px; overflow: visible; }
  .end h1 { position: absolute; left: 0; right: 0; top: 56%; margin: 0; text-align: center; font-weight: 300; font-size: 112px; letter-spacing: .14em; line-height: 1; }
  .end h1 b { font-weight: 800; letter-spacing: .04em; }
  .end p { position: absolute; left: 0; right: 0; top: 64%; margin: 0; text-align: center; font-size: 44px; font-weight: 400; color: #d6d6f2; }
  .end small { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 600 20px/1 "JetBrains Mono", monospace; letter-spacing: .2em; color: var(--muted); }
  .flash { position: absolute; inset: 0; background: #27bdfa; mix-blend-mode: screen; opacity: 0; pointer-events: none; z-index: 8; }
</style>

48 42.55C1728.63 42.55 1743.64 44.74 1755.51 49.13C1767.38 53.52 1776.23 60.13 1782.06 68.95C1787.89 77.77 1790.8 88.87 1790.8 102.25C1790.8 111.11 1789.16 118.93 1785.89 125.73C1782.61 132.52 1778.22 138.35 1772.72 143.23C1767.22 148.1 1761.13 152.16 1754.45 155.4L1813.13 242.55L1762.37 242.55L1716.01 166.83L1695.75 166.83L1695.75 242.55L1650.32 242.55L1650.32 42.55ZM1708.04 78.89L1695.75 78.89L1695.75 130.76L1708.51 130.76C1721.06 130.76 1730.27 128.55 1736.13 124.12C1741.99 119.7 1744.92 112.89 1744.92 103.7C1744.92 95 1741.94 88.69 1735.98 84.77C1730.01 80.85 1720.7 78.89 1708.04 78.89Z"/><path fill="#FFFFFF" d="M2086.37 140.63C2086.37 162.97 2082.42 181.72 2074.53 196.85C2066.64 211.99 2054.97 223.39 2039.51 231.05C2024.05 238.72 2004.92 242.55 1982.12 242.55L1934.24 242.55L1934.24 42.55L1988.42 42.55C2009.76 42.55 2027.68 46.28 2042.18 53.76C2056.68 61.24 2067.67 72.25 2075.15 86.8C2082.63 101.35 2086.37 119.29 2086.37 140.63ZM2071.59 141.18C2071.59 122.12 2068.49 106.2 2062.29 93.43C2056.09 80.67 2046.6 71.07 2033.83 64.64C2021.07 58.21 2004.88 54.99 1985.27 54.99L1948.34 54.99L1948.34 230.1L1981.44 230.1C2011.63 230.1 2034.2 222.69 2049.16 207.87C2064.11 193.05 2071.59 170.82 2071.59 141.18Z M2251.99 190.97C2251.99 202.92 2248.98 212.93 2242.96 221C2236.94 229.07 2228.77 235.14 2218.47 239.19C2208.16 243.25 2196.49 245.28 2183.45 245.28C2175.33 245.28 2167.97 244.89 2161.36 244.12C2154.74 243.34 2148.77 242.32 2143.44 241.04C2138.1 239.76 2133.24 238.3 2128.87 236.66L2128.87 222.57C2135.98 225.31 2144.21 227.7 2153.56 229.75C2162.91 231.81 2173.1 232.83 2184.13 232.83C2194.53 232.83 2203.76 231.33 2211.83 228.32C2219.91 225.31 2226.27 220.75 2230.92 214.64C2235.57 208.53 2237.89 200.82 2237.89 191.52C2237.89 183.31 2235.96 176.59 2232.08 171.34C2228.2 166.1 2222.39 161.58 2214.64 157.8C2206.89 154.01 2197.13 150.16 2185.36 146.24C2177.16 143.41 2169.7 140.43 2163 137.28C2156.29 134.13 2150.57 130.48 2145.83 126.33C2141.09 122.19 2137.46 117.17 2134.95 111.29 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  // Render mode drives the rays shader from the film clock so every frame is repeatable.
  window.__t = 0;
  if (new URLSearchParams(location.search).has("render")) {
    const raf = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = (cb) => raf(() => cb(8000 + window.__t * 1000));
  }
  window.NS = {};
</script>
<script src="site/js/rays.js"></script>
<script>
  const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
  const stage = $("#stage");
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  addEventListener("resize", fit); fit();
  NS.sideRays($("#rays"), { rayColor2: "#3B82F6", spread: 3, falloff: 1.1, intensity: 2, sourceX: 0.8, sourceY: -0.35 });
  $("#rays").insertAdjacentHTML("beforeend", `<svg class="rays__mark" viewBox="113 105 374 390" aria-hidden="true"><path d="M236.16 424.87L300 313.14L300.6 314.19L300.6 277.6L300 278.02L263 251.59L133.3 470.98Z" fill="#FFFFFF"/><path d="M466.7 470.98L337 251.59L300 278.02L299.4 277.6L299.4 314.19L300 313.14L363.84 424.87Z" fill="#FFFFFF"/><path d="M300 129.02L353.38 219L300 257.13L246.62 219Z" fill="#27BDFA"/></svg>`);

  // Building blocks
  const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; };
  const put = (rig, node, p = {}) => { gsap.set(node, { x: 0, y: 0, z: 0, ...p }); $(rig).appendChild(node); return node; };
  const shot = (name) => el(`<div class="card"><img src="shots/${name}.jpg" alt=""></div>`);
  const live = (id, cls = "") => el(`<div class="dash ${cls}"><iframe src="site/dashboards/${id}.html" scrolling="no" tabindex="-1"></iframe></div>`);
  const liveCard = (id) => { const c = el(`<div class="card"></div>`); c.appendChild(live(id)); return c; };

  // Script lines, approved 2026-10-27 (script.md)
  const LINES = [
    ["02  Built for scale", "A design system for dense, data-heavy enterprise products."],
    ["03  Foundations", "It starts with 225 tokens for color, type, spacing, motion and elevation."],
    ["04  Components", "On top of them sit 57 components, each with a live playground, a token table, code and accessibility notes."],
    ["05  Patterns and layouts", "It goes past components into 9 patterns, 7 floorplans and 24 dashboard layouts."],
    ["06  Developers", "Developers get every value as a CSS variable, an element reference and specs synced from Figma."],
    ["07  Live tools", "Live tools let you build a screen, edit tokens and search the whole library from the keyboard."],
    ["08  Accessibility", "Accessibility is built in, with a contrast checker and WCAG mapping, next to component status and a changelog."],
    ["09  Theming", "Change one token and every screen updates, in dark or light and at any density."]];
  const lines = LINES.map(([k, t]) => {
    const l = el(`<div class="line"><div class="k">${k}</div><p>${t.split(" ").map((w) => `<span class="w">${w}</span>`).join(" ")}</p></div>`);
    $("#lines").appendChild(l); return l;
  });
  const say = (i, at, hold) => {
    const l = lines[i];
    tl.set(l, { opacity: 1, y: 0 }, at)
      .fromTo(l.querySelector(".k"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .5, ease: "power3.out" }, at)
      .fromTo(l.querySelectorAll(".w"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: .7, stagger: .035, ease: "expo.out" }, at + .08)
      .to(l, { opacity: 0, y: -16, duration: .35, ease: "power2.in" }, at + hold);
  };
  const scene = (id, from, to) => { tl.set(id, { visibility: "visible" }, from); if (to != null) tl.set(id, { visibility: "hidden" }, to); };
  const flash = (at) => tl.fromTo("#flash", { opacity: .55 }, { opacity: 0, duration: .45, ease: "power2.out", immediateRender: false }, at);

  const tl = gsap.timeline({ defaults: { ease: "power3.inOut" }, onUpdate: () => { window.__t = tl.time(); } });

  /* 1. Logo assembles under the rays (0 - 4.4) */
  gsap.set("#rays canvas", { opacity: 0 }); gsap.set("#scrim", { opacity: 0 });
  scene("#s1", 0, 4.4);
  const word = $("#word"); word.innerHTML = word.innerHTML.replace(/(NORTHSTAR )/, (m) => m.split("").map((c) => `<span class="c">${c === " " ? "&nbsp;" : c}</span>`).join(""));
  tl.to("#rays canvas", { opacity: 1, duration: 2.2, ease: "power2.out" }, 0)
    .from("#chevL", { x: -160, y: 120, opacity: 0, duration: 1.2, ease: "expo.out" }, .3)
    .from("#chevR", { x: 160, y: 120, opacity: 0, duration: 1.2, ease: "expo.out" }, .38)
    .from("#dia", { y: -260, opacity: 0, duration: 1, ease: "bounce.out" }, .9)
    .from(".logo", { scale: .8, duration: 3.6, ease: "power1.out", transformOrigin: "50% 50%" }, .3)
    .from("#word .c, #word b", { opacity: 0, y: 30, filter: "blur(8px)", duration: .8, stagger: .05, ease: "expo.out" }, 1.5)
    .from("#tag", { opacity: 0, letterSpacing: ".6em", duration: 1.2, ease: "expo.out" }, 2.2)
    .to("#s1", { opacity: 0, scale: 1.08, duration: .5, ease: "power2.in" }, 3.9);

  /* 2. The docs site flies in (4.4 - 8.6) */
  scene("#s2", 4.4, 8.6);
  const home = put("#r2", shot("home"));
  tl.set("#scrim", { opacity: 1 }, 4.4)
    .fromTo("#r2", { z: -1400, rotationX: 38, rotationY: -26, rotationZ: 6 }, { z: 60, rotationX: 4, rotationY: 8, rotationZ: 0, duration: 3.6, ease: "expo.out" }, 4.4)
    .to("#r2", { rotationY: -4, z: 140, duration: .9, ease: "power2.in" }, 7.7);
  say(0, 4.8, 3.5);

  /* 3. Foundations: swatches float at three depths over the token pages (8.6 - 13.2) */
  scene("#s3", 8.6, 13.2);
  put("#r3", shot("typography"), { x: -900, y: -260, z: -1600, rotationY: 18, opacity: .55 });
  put("#r3", shot("tokens"), { x: 950, y: 260, z: -1900, rotationY: -18, opacity: .5 });
  put("#r3", shot("color"), { x: 0, y: -60, z: -900, opacity: .7 });
  const SW = [["Navy 900", "--ns-navy-900", "var(--ns-navy-900)"], ["Blue 500", "--ns-blue-500", "var(--ns-blue-500)"], ["Teal 500", "--ns-teal-500", "var(--ns-teal-500)"], ["Purple 500", "--ns-purple-500", "var(--ns-purple-500)"],
    ["Green 500", "--ns-green-500", "var(--ns-green-500)"], ["Yellow 500", "--ns-yellow-500", "var(--ns-yellow-500)"], ["Red 400", "--ns-red-400", "var(--ns-red-400)"], ["Persian blue", "--ns-persian-500", "var(--ns-persian-500)"]];
  const SWP = [[-640, -300, 250], [-160, -360, 60], [420, -280, 380], [700, 60, 120], [-760, 120, 420], [120, 300, 320], [-300, 20, -120], [560, 400, -60]];
  const sws = SW.map(([n, t, c], i) => put("#r3", el(`<div class="swatch"><i style="background:${c}"></i><b>${n}</b><span>${t}</span></div>`), { x: SWP[i][0], y: SWP[i][1], z: SWP[i][2], rotationY: -SWP[i][0] / 60 }));
  const big3 = put("#r3", el(`<div class="big" style="font-size:300px;margin:-160px 0 0 120px"><span id="n215">0</span><small>Design tokens</small></div>`), { z: 520 });
  const cnt = { v: 0 };
  tl.fromTo("#r3", { rotationY: 16, rotationX: -6, x: 180, z: -300 }, { rotationY: -14, rotationX: 4, x: -160, z: 0, duration: 4.6, ease: "sine.inOut" }, 8.6)
    .from(sws, { opacity: 0, z: "-=900", duration: 1.1, stagger: .09, ease: "expo.out" }, 8.6)
    .from(big3, { opacity: 0, duration: .5 }, 9.0)
    .to(cnt, { v: 225, duration: 1.8, ease: "power2.out", onUpdate: () => { $("#n215").textContent = Math.round(cnt.v); } }, 9.0);
  flash(8.6);
  say(1, 9.0, 3.8);

  /* 4. Components: the full library scrolls past like a conveyor; names tick by (13.2 - 18.4) */
  scene("#s4", 13.2, 18.4);
  const lib = put("#r4", el(`<div class="card" style="height:6895px;margin:-3447px 0 0 -800px"><img src="shots/components.jpg" alt=""></div>`), { x: -260, rotationX: 52, rotationZ: -14 });
  const NAMES = "Accordion,Alert banner,Avatar,Badge,Bar chart,Breadcrumb,Bubble chart,Bullet chart,Button,Calendar chart,Candlestick chart,Card,Checkbox,Combobox,Command palette,Data table,Date picker,Divider,Dumbbell chart,File uploader,Funnel chart,Gauge chart,Heatmap chart,Inline edit,Line chart,Link,Menu,Modal,Notification,Number stepper,Pagination,Parallel coordinates chart,Pie chart,Popover,Progress,Radar chart,Radial bar chart,Radial convergence chart,Radial histogram chart,Radio button,Sankey chart,Scatter chart,Segmented control,Select,Side navigation,Slider,Stepped line chart,Sunburst chart,Switch,Tabs,Tag,Text input,Textarea,Tooltip,Tree chart,Tree view,Treemap chart".split(",");
  $("#tick").innerHTML = NAMES.map((n, i) => `<div><span>${String(i + 1).padStart(2, "0")}</span>${n}</div>`).join("");
  const big4 = put("#r4", el(`<div class="big" style="font-size:300px;margin:-470px 0 0 -640px"><span id="n60">0</span><small>Components</small></div>`), { z: 200 });
  const c60 = { v: 0 };
  tl.fromTo(lib, { y: 2700 }, { y: -900, duration: 5.2, ease: "none" }, 13.2)
    .fromTo("#r4", { rotationY: 10, z: -200 }, { rotationY: -6, z: 80, duration: 5.2, ease: "sine.inOut" }, 13.2)
    .fromTo("#tick", { y: 540 }, { y: 540 - 58 * NAMES.length, duration: 5.2, ease: "power1.inOut" }, 13.2)
    .from(big4, { opacity: 0, duration: .5 }, 13.4)
    .to(c60, { v: 57, duration: 2.2, ease: "power2.out", onUpdate: () => { $("#n60").textContent = Math.round(c60.v); } }, 13.4);
  flash(13.2);
  say(2, 13.6, 4.4);

  /* 5a. A layout assembles on the 12-column grid (18.4 - 21.0) */
  scene("#s5a", 18.4, 21.0);
  const cols = $("#cols"); for (let i = 0; i < 12; i++) cols.appendChild(document.createElement("i"));
  const BLOCKS = [[96, 88, 860, 590, "var(--ns-interactive-primary)", ".hero  col 1 / 8"], [970, 88, 236, 288, "#1c1c3a", ".k-spend"], [1220, 88, 360, 288, "var(--ns-teal-500)", ".k-conv"],
    [970, 390, 236, 288, "#1c1c3a", ".pace"], [1220, 390, 360, 560, "#1c1c3a", ".chan  row 2 / 4"], [96, 692, 485, 260, "#1c1c3a", ".fun"], [595, 692, 611, 260, "#1c1c3a", ".heat"]];
  const blks = BLOCKS.map(([x, y, w, h, bg, lab]) => { const b = el(`<div class="blk" style="left:${x * 1.2}px;top:${y * 1.2}px;width:${w * 1.2}px;height:${h * 1.2}px;background:${bg}"><b>${lab}</b></div>`); $("#s5a").appendChild(b); return b; });
  gsap.set(cols.children, { scaleY: 0 }); gsap.set(blks, { clipPath: "inset(0 0 100% 0)" });
  tl.to(cols.children, { scaleY: 1, duration: .6, stagger: .03, ease: "power3.inOut" }, 18.4);
  blks.forEach((b, i) => tl.to(b, { clipPath: "inset(0 0 0% 0)", duration: .45, ease: "power4.out" }, 18.9 + i * .12));

  /* 5b. It resolves into the real layout, then the camera pulls back through the library (21.0 - 25.4) */
  scene("#s5", 20.4, 25.4);
  const WALL = [["patterns", -1720, -1000, -300], ["floorplans", 0, -1000, -600], ["forms", 1720, -1000, -200], ["@status-wall", -1720, 0, -500], ["@campaign-command", 0, 0, 0],
    ["@portfolio", 1720, 0, -350], ["graphics", -1720, 1000, -150], ["charts", 0, 1000, -450], ["dashboards", 1720, 1000, -250]];
  const wall = WALL.map(([n, x, y, z]) => put("#r5", n[0] === "@" ? liveCard(n.slice(1)) : shot(n), { x, y, z }));
  const CH = [["<em>9</em> patterns", -900, -620], ["<em>7</em> floorplans", 760, -560], ["<em>24</em> dashboard layouts", 380, 600]];
  const chips = CH.map(([t, x, y]) => put("#r5", el(`<div class="chip chip--big">${t}</div>`), { x, y, z: 500 }));
  gsap.set(wall.filter((_, i) => i !== 4), { opacity: 0 });
  tl.fromTo(wall[4], { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: .7, ease: "power4.inOut" }, 20.4)
    .fromTo("#r5", { z: 266.7, rotationY: 0, rotationX: 0 }, { z: 266.7, duration: .01 }, 20.4)
    .to("#r5", { z: -2600, rotationY: 14, rotationX: 8, duration: 3.2, ease: "expo.inOut" }, 21.3)
    .to(wall.filter((_, i) => i !== 4), { opacity: 1, duration: 1, stagger: { each: .07, from: "center" } }, 21.6)
    .to("#r5", { rotationY: -10, x: 220, duration: 2.2, ease: "sine.inOut" }, 23.2)
    .from(chips, { opacity: 0, scale: .6, duration: .6, stagger: .25, ease: "back.out(2)" }, 22.6)
    .to("#scrim", { opacity: 0, duration: .3 }, 18.4).to("#scrim", { opacity: 1, duration: .5 }, 21.4);
  say(3, 21.8, 3.3);

  /* 6. Developers: tokens, element reference and the Figma spec, fanned in depth (25.4 - 30.0) */
  scene("#s6", 25.4, 30.0);
  const devs = [put("#r6", shot("element-ref"), { x: -760, z: -520, rotationY: 30 }), put("#r6", shot("spec"), { x: 760, z: -520, rotationY: -30 }), put("#r6", shot("tokens"), { z: -120 })];
  const VARS = ["--ns-interactive-primary", "--ns-background-primary", "--ns-chart-series-1", "--ns-focus-ring", "--ns-layer-01", "--ns-space-4"];
  const VP = [[-640, -360, 420], [380, -420, 260], [700, -40, 520], [-760, 140, 300], [-200, 300, 600], [520, 330, 380]];
  const vars = VARS.map((v, i) => put("#r6", el(`<div class="chip">var(<em>${v}</em>)</div>`), { x: VP[i][0], y: VP[i][1], z: VP[i][2] }));
  tl.fromTo("#r6", { rotationY: -18, x: -200, z: -500 }, { rotationY: 14, x: 160, z: -200, duration: 4.6, ease: "sine.inOut" }, 25.4)
    .from(devs, { opacity: 0, rotationX: -40, y: "+=300", duration: 1, stagger: .12, ease: "expo.out" }, 25.4)
    .from(vars, { opacity: 0, z: "-=600", duration: .8, stagger: .12, ease: "expo.out" }, 25.9);
  flash(25.4);
  say(4, 25.8, 3.8);

  /* 7. Live tools: builder and token editor behind, command search in front, the key cap (30.0 - 34.6) */
  scene("#s7", 30.0, 34.6);
  const tools = [put("#r7", shot("builder"), { x: -860, y: -120, z: -900, rotationY: 24 }), put("#r7", shot("token-editor"), { x: 860, y: -120, z: -900, rotationY: -24 }), put("#r7", shot("cmdk"), { y: 0, z: -200 })];
  const key = put("#r7", el(`<div class="key" style="margin:120px 0 0 300px"><span>⌘</span><span>K</span></div>`), { z: 560 });
  tl.fromTo("#r7", { z: -400, rotationX: 10 }, { z: 40, rotationX: -2, duration: 4.6, ease: "power2.out" }, 30.0)
    .from(tools, { opacity: 0, z: "-=800", duration: 1, stagger: .14, ease: "expo.out" }, 30.0)
    .from(key, { opacity: 0, y: 120, duration: .6, ease: "back.out(2)" }, 30.6)
    .to(key.children, { y: 12, boxShadow: "0 0 0 1.5px #27bdfa, 0 2px 0 #08080f, 0 20px 40px -10px #000", duration: .12, yoyo: true, repeat: 1, stagger: .08, ease: "power1.inOut" }, 31.4);
  flash(30.0);
  say(5, 30.4, 3.8);

  /* 8. Accessibility and governance: a tilted grid slides past (34.6 - 39.2) */
  scene("#s8", 34.6, 39.2);
  const A11Y = [["contrast", -1720, -520, 0], ["wcag", 0, -520, -400], ["status", 1720, -520, -150], ["checklist", 3440, -520, -350], ["changelog", -860, 520, -250], ["element-ref", 860, 520, 0], ["how-tokens", 2580, 520, -300]];
  const a11y = A11Y.map(([n, x, y, z]) => put("#r8", shot(n === "checklist" ? "contrast" : n), { x, y, z }));
  tl.fromTo("#r8", { x: 900, z: -1500, rotationY: -22, rotationX: 12 }, { x: -1300, z: -1300, rotationY: -12, rotationX: 6, duration: 4.6, ease: "sine.inOut" }, 34.6)
    .from(a11y, { opacity: 0, duration: .6, stagger: .06 }, 34.6);
  flash(34.6);
  say(6, 35.0, 3.8);

  /* 9. Theming: one token line wipes the layout from dark to light (39.2 - 43.6) */
  scene("#s9", 39.2, 43.6);
  const light = live("status-wall"), darkD = live("status-wall");
  [light, darkD].forEach((d) => { d.style.transformOrigin = "0 0"; $("#s9").appendChild(d); });
  light.querySelector("iframe").addEventListener("load", (e) => { e.target.contentDocument.documentElement.dataset.theme = "light"; });
  $("#s9").insertAdjacentHTML("beforeend", `<div style="position:absolute;inset:0;z-index:2;background:linear-gradient(0deg,#05050f 0%,#05050fe6 30%,transparent 52%)"></div><div class="split" id="split"></div><div class="chip" id="tchip" style="top:26px">data-theme: <em id="theme">dark</em></div>`);
  tl.fromTo([light, darkD], { scale: 1.2 }, { scale: 1.25, duration: 4.4, ease: "none" }, 39.2)
    .fromTo(darkD, { clipPath: "inset(0 0 0 0)" }, { clipPath: "inset(0 100% 0 0)", duration: 2.2, ease: "power3.inOut" }, 39.7)
    .fromTo("#split", { left: 1920 }, { left: 0, duration: 2.2, ease: "power3.inOut" }, 39.7)
    .fromTo("#tchip", { left: 1460 }, { left: 440, duration: 2.2, ease: "power3.inOut" }, 39.7)
    .call(() => { $("#theme").textContent = "dark"; }, null, 39.3)
    .call(() => { $("#theme").textContent = "light"; }, null, 40.8)
    .to("#split", { opacity: 0, duration: .3 }, 41.9);
  say(7, 40.2, 3.1);

  /* 10. End card under the rays (43.6 - 48.6) */
  scene("#s10", 43.6, null);
  tl.to("#scrim", { opacity: 0, duration: .4 }, 43.4)
    .from("#s10 .endmark", { scale: .7, opacity: 0, y: 60, duration: 1.1, ease: "expo.out", transformOrigin: "50% 50%" }, 43.6)
    .from(".dia2", { y: -420, opacity: 0, duration: .9, ease: "bounce.out" }, 43.9)
    .from("#s10 p", { y: 24, opacity: 0, duration: .8, ease: "expo.out" }, 44.7)
    .from("#s10 small", { opacity: 0, duration: .8 }, 45.2)
    .to({}, { duration: 2.6 }, 46.0);
  flash(43.6);

  // Playback and the renderer hook
  const render = new URLSearchParams(location.search).has("render");
  tl.pause(0);
  window.__film = { duration: tl.duration(), seek: (t) => { tl.seek(t, false); window.__t = t; return 1; } };
  const frames = [...document.querySelectorAll("iframe")].map((f) => new Promise((r) => { if (f.contentDocument && f.contentDocument.readyState === "complete") r(); else f.addEventListener("load", r, { once: true }); }));
  const imgs = [...document.images].map((i) => i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }));
  Promise.all([...frames, ...imgs]).then(() => document.fonts.ready).then(() => { window.__ready = true; if (!render) tl.play(0); });
  if (!render) addEventListener("click", () => tl.restart());
</script>
</body>
</html>
