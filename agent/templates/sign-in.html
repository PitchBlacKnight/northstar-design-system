<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/components.css">
<title>Sign in</title>
<meta name="description" content="A sign-in card with email and password fields, an inline error alert, a primary action and a link to reset the password.">
<script src="../../js/ns-behavior.js" defer></script>
</head>
<body class="ns-body">
<div class="ns-app ns-app--no-nav">
<main class="ns-app__main">
  <section class="ns-modal ns-modal--sm ns-modal--inline" aria-labelledby="si-title">
    <div class="ns-modal__head"><div><p class="ns-modal__label">NorthStar Console</p><h1 class="ns-modal__title" id="si-title">Sign in</h1></div></div>
    <form class="ns-modal__body ns-stack" novalidate>
      <div class="ns-alert ns-alert--error" role="alert"><span class="ns-alert__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16v-4M12 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg></span><div><p class="ns-alert__title">Email or password is incorrect</p><p class="ns-alert__desc">Check both and try again.</p></div></div>
      <div class="ns-field is-error"><label class="ns-label" for="si-email">Work email</label><input class="ns-input" id="si-email" type="email" autocomplete="username" value="sam@acme.example" aria-invalid="true" aria-describedby="si-email-h"><span class="ns-helper" id="si-email-h">Use the address your admin invited.</span></div>
      <div class="ns-field"><label class="ns-label" for="si-pass">Password</label><input class="ns-input" id="si-pass" type="password" autocomplete="current-password"></div>
      <label class="ns-check"><input type="checkbox"> Keep me signed in on this device</label>
      <button class="ns-btn ns-btn--block" type="submit">Sign in</button>
      <p class="ns-helper"><a class="ns-link" href="#">Reset your password</a></p>
    </form>
  </section>
</main>
</div>
</body>
</html>
