<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="NorthStar"><title>NorthStar</title><style>
.star{transform-box:fill-box;transform-origin:50% 62%}
.spark,.ring{opacity:0}
*{animation-play-state:var(--p,running)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.fly{animation:fly .62s cubic-bezier(.45,0,.25,1) calc(0.1s - var(--t,0s)) both}
.trail{animation:trail .95s ease-out calc(0.1s - var(--t,0s)) both}
.star{animation:land .5s cubic-bezier(.16,1,.3,1) calc(0.68s - var(--t,0s)) both}
.ring{animation:ring .7s ease-out calc(0.68s - var(--t,0s)) both}
.s1{animation:glint .7s ease-out calc(0.66s - var(--t,0s)) both}
.al{animation:al .8s cubic-bezier(.16,1,.3,1) calc(0.62s - var(--t,0s)) both}
.ar{animation:ar .8s cubic-bezier(.16,1,.3,1) calc(0.62s - var(--t,0s)) both}
@keyframes fly{from{transform:translate(340px,-440px)}}
@keyframes trail{0%{opacity:0}20%,55%{opacity:1}100%{opacity:0}}
@keyframes land{from{transform:scale(1.28)}}
@keyframes ring{0%{opacity:0;transform:scale(.2)}8%{opacity:.7}100%{opacity:0;transform:scale(1)}}
@keyframes glint{0%{opacity:0;transform:scale(0)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.25) rotate(45deg)}}
@keyframes al{from{opacity:0;transform:translate(-46px,78px)}}
@keyframes ar{from{opacity:0;transform:translate(46px,78px)}}
</style><g fill="#FFFFFF"><path class="arm al" d="M236.16 424.87L300 313.14L300.6 314.19L300.6 277.6L300 278.02L263 251.59L133.3 470.98Z"/><path class="arm ar" d="M466.7 470.98L337 251.59L300 278.02L299.4 277.6L299.4 314.19L300 313.14L363.84 424.87Z"/></g><g transform="translate(300 205)"><circle class="ring" r="150" fill="none" stroke="#27BDFA" stroke-width="5"/></g><g class="fly"><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="300" y1="205" x2="483.45" y2="-32.41"><stop offset="0" stop-color="#27BDFA" stop-opacity=".85"/><stop offset="1" stop-color="#27BDFA" stop-opacity="0"/></linearGradient><path class="trail" fill="url(#tg)" d="M311.87 214.18L483.45 -32.41L288.13 195.83Z"/><path class="star" fill="#27BDFA" d="M300 129.02L353.38 219L300 257.13L246.62 219Z"/></g><g transform="translate(300 205)"><path class="spark s1" fill="#FFFFFF" d="M0 -170L9 -9L170 0L9 9L0 170L-9 9L-170 0L-9 -9Z"/></g><g transform="translate(182 153)"><path class="spark s2" fill="#FFFFFF" d="M0 -40L4 -4L40 0L4 4L0 40L-4 4L-40 0L-4 -4Z"/></g><g transform="translate(404 227)"><path class="spark s3" fill="#FFFFFF" d="M0 -30L3 -3L30 0L3 3L0 30L-3 3L-30 0L-3 -3Z"/></g></svg>
