<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NorthStar DS wordmark, five typefaces</title>
<style>
  html, body { margin: 0; background: #0f0f20; color: #fff; }
  section { padding: 20px 24px 28px; border-bottom: 1px solid #2a2a48; }
  h2 { margin: 0 0 14px; font: 600 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 1.4px; text-transform: uppercase; display: flex; justify-content: space-between; }
  h2 span { opacity: .55; }
  .pair { display: grid; grid-template-columns: 1.6fr 1.6fr 1fr 1fr; gap: 12px; }
  figure { margin: 0; display: grid; place-items: center; padding: 34px 5%; border-radius: 10px; }
  figure img { width: 100%; height: auto; display: block; }
  .dark { background: #191932; } .light { background: #fff; } .blue { background: #023aff; } .mono { background: #e9e9ee; }
  @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } }
</style></head><body><section><h2>Archivo Expanded<span>NORTHSTAR 621 / DS 100</span></h2><div class="pair"><figure class="dark"><img src="typefaces/northstar-ds-archivo-expanded-dark.svg" alt=""></figure><figure class="light"><img src="typefaces/northstar-ds-archivo-expanded-light.svg" alt=""></figure><figure class="blue"><img src="typefaces/northstar-ds-archivo-expanded-on-blue.svg" alt=""></figure><figure class="mono"><img src="typefaces/northstar-ds-archivo-expanded-mono.svg" alt=""></figure></div></section><section><h2>Unbounded<span>NORTHSTAR 504 / DS 200</span></h2><div class="pair"><figure class="dark"><img src="typefaces/northstar-ds-unbounded-dark.svg" alt=""></figure><figure class="light"><img src="typefaces/northstar-ds-unbounded-light.svg" alt=""></figure><figure class="blue"><img src="typefaces/northstar-ds-unbounded-on-blue.svg" alt=""></figure><figure class="mono"><img src="typefaces/northstar-ds-unbounded-mono.svg" alt=""></figure></div></section><section><h2>Jost<span>NORTHSTAR 663 / DS 200</span></h2><div class="pair"><figure class="dark"><img src="typefaces/northstar-ds-jost-dark.svg" alt=""></figure><figure class="light"><img src="typefaces/northstar-ds-jost-light.svg" alt=""></figure><figure class="blue"><img src="typefaces/northstar-ds-jost-on-blue.svg" alt=""></figure><figure class="mono"><img src="typefaces/northstar-ds-jost-mono.svg" alt=""></figure></div></section><section><h2>Oxanium<span>NORTHSTAR 743 / DS 200</span></h2><div class="pair"><figure class="dark"><img src="typefaces/northstar-ds-oxanium-dark.svg" alt=""></figure><figure class="light"><img src="typefaces/northstar-ds-oxanium-light.svg" alt=""></figure><figure class="blue"><img src="typefaces/northstar-ds-oxanium-on-blue.svg" alt=""></figure><figure class="mono"><img src="typefaces/northstar-ds-oxanium-mono.svg" alt=""></figure></div></section><section><h2>Fraunces<span>NORTHSTAR 652 / DS 300</span></h2><div class="pair"><figure class="dark"><img src="typefaces/northstar-ds-fraunces-dark.svg" alt=""></figure><figure class="light"><img src="typefaces/northstar-ds-fraunces-light.svg" alt=""></figure><figure class="blue"><img src="typefaces/northstar-ds-fraunces-on-blue.svg" alt=""></figure><figure class="mono"><img src="typefaces/northstar-ds-fraunces-mono.svg" alt=""></figure></div></section></body></html>
